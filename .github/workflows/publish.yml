name: Publish RPM to Foreman/Katello

on:
  workflow_run:
    workflows:
      - Create RPM
    types:
      - completed

jobs:
  release:
    name: Upload RPMs
    runs-on: ubuntu-latest
    container: ghcr.io/beatrubi/hammer/hammer:latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push rpms
        env:
          SAT_HOST: ${{ secrets.SAT_HOST }}
          SAT_USER: ${{ secrets.SAT_USER }}
          SAT_PASS: ${{ secrets.SAT_PASS }}
        run: |
          hammer -s $SAT_HOST -u $SAT_USER -p $SAT_PASS repository \
          upload-content --organization Default --product Custom --name el9 --path 'RPMS/*/*.rpm'
          hammer -s $SAT_HOST -u $SAT_USER -p $SAT_PASS repository \
          upload-content --organization Default --product Custom --name el9 --path 'SPMS/*.rpm'
